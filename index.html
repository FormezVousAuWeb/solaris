<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F9F7F2">
<link rel="icon" id="favicon" type="image/png">
<title>Solaris — La météo d’une trésorerie complice</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brume:#F9F7F2; --carte:#FFFFFF; --encre:#2A2A2A; --second:#544E48;
  --ligne:#E7E1D6; --nuit1:#3C2449; --nuit2:#5A3A6B;
  --azur:#A14F94; --azur-doux:#F5E9F3;
  --mauve:#A14F94; --mauve-fonce:#7E3B74; --mauve-doux:#F5E9F3;
  --or:#EFAB2B; --or-fonce:#8A6410; --or-doux:#FBF0D5;
  --menthe:#0B7A55; --menthe-doux:#E3F2EB;
  --corail:#C63434; --corail-doux:#FBE9E7;
  --ambre:#B45309; --ambre-doux:#FCEBD7;
  --orange:#B45309; --orange-doux:#FCEBD7;
  --lavande:#9A7412; --lavande-doux:#FBF0D5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--brume); color:var(--encre);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15.5px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Poppins','Instrument Sans',sans-serif}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
button{font:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
header{padding:26px 0 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-logo{width:44px;height:44px;border-radius:50%;box-shadow:0 1px 5px rgba(60,36,73,.2);flex:none}
.brand h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:12.5px;font-weight:500;color:var(--second);letter-spacing:0}
.today{font-size:13.5px;color:var(--second);font-weight:500}
nav.tabs{display:flex;justify-content:center;margin:22px 0 26px}
.tabs-inner{display:inline-flex;background:var(--carte);border:1px solid var(--ligne);border-radius:999px;padding:4px;box-shadow:0 1px 2px rgba(16,35,64,.05)}
.tabs-inner button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14.5px;color:var(--second);transition:background .15s,color .15s}
.tabs-inner button:hover{color:var(--encre)}
.tabs-inner button[aria-selected="true"]{background:var(--nuit1);color:#fff}
:focus-visible{outline:2px solid var(--azur);outline-offset:2px;border-radius:6px}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:22px;color:#F7F3FB;
  background:linear-gradient(140deg,#2A1638 0%,#3C2449 55%,#5A3A6B 100%);
  padding:30px 30px 26px;box-shadow:0 10px 30px -12px rgba(15,33,64,.45);
}
.hero>*{position:relative;z-index:2}
.sky{position:absolute;inset:0;z-index:1;pointer-events:none}
.stars circle{fill:#fff;opacity:.5}
.cloud{fill:#fff;opacity:.05;animation:drift 46s linear infinite}
.cloud.c2{animation-duration:64s;animation-delay:-22s;opacity:.04}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1100px)}}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 14px 6px 10px;font-weight:700;font-size:14px}
.chip .ic{width:19px;height:19px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:start}
.env-label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(247,243,251,.65);margin:14px 0 2px}
.big{font-size:clamp(46px,6.5vw,62px);font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:20px;font-weight:600;color:rgba(247,243,251,.75);letter-spacing:0;margin-left:6px}
.hero-msg{margin-top:10px;font-size:15px;color:rgba(247,243,251,.85);max-width:44ch}
.seg{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:rgba(247,243,251,.75);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:#fff;color:var(--nuit1)}
.releve{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:16px 18px;margin-top:16px}
.releve-title{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,243,251,.6);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.rrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px dashed rgba(255,255,255,.14);font-size:14.5px}
.rrow:first-of-type{border-top:0}
.rrow .lbl{color:rgba(247,243,251,.85)}
.rrow .lbl b{color:#fff;font-weight:600}
.rrow .sub{display:block;font-size:12px;color:rgba(247,243,251,.55);margin-top:1px}
.rrow .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rrow.result{border-top:1px solid rgba(255,255,255,.3);padding-top:10px;background:rgba(239,171,43,.15);margin:6px -8px 0;padding-left:8px;padding-right:8px;border-radius:8px}
.rrow.result .val{color:#F5CE6B;font-size:17px}
.strip-cap{margin-top:18px;font-size:12.5px;font-weight:600;color:rgba(247,243,251,.6);display:flex;justify-content:space-between;gap:10px}
.strip{display:flex;gap:2px;margin-top:6px}
.strip i{flex:1;height:11px;border-radius:3px;min-width:0}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:14px;margin:18px 0 26px}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,35,64,.05)}
.stat h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--second);display:flex;align-items:center;gap:7px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:13px;color:var(--second);margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;font-size:12px;font-weight:700;padding:3px 10px;margin-top:8px}
.tag.ok{background:var(--menthe-doux);color:var(--menthe)}
.tag.warn{background:var(--ambre-doux);color:var(--ambre)}
.tag.bad{background:var(--corail-doux);color:var(--corail)}
.tag.info{background:var(--azur-doux);color:var(--azur)}
.bar{height:7px;border-radius:99px;background:#EAE3D8;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--lavande)}
.stat.link{cursor:pointer;transition:border-color .15s, box-shadow .15s}
.stat.link:hover{border-color:var(--azur);box-shadow:0 3px 10px -4px rgba(46,107,230,.35)}

/* ---------- sections & lists ---------- */
section.block{margin-bottom:30px}
.block h2{font-size:19px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.block .hint{font-size:13.5px;color:var(--second);margin-bottom:12px}
.rows{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:12px 18px;border-top:1px solid var(--ligne)}
.row:first-child{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.row .grow{flex:1;min-width:0}
.row .lbl{font-weight:600;font-size:14.5px}
.row .sub{font-size:12.5px;color:var(--second)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--menthe)} .amt.out{color:var(--corail)}
.badge{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.amb{background:var(--ambre-doux);color:var(--ambre)}
.badge.az{background:var(--azur-doux);color:var(--azur)}
.badge.lv{background:var(--lavande-doux);color:var(--lavande)}
.badge.gr{background:#EAE3D8;color:var(--second)}
.tipcard{display:flex;gap:12px;background:var(--azur-doux);border:1px solid #CBDDF8;border-radius:16px;padding:14px 18px;margin-bottom:14px;font-size:14.5px}
.tipcard .ic{color:var(--azur);margin-top:2px}
.tipcard b{font-weight:700}
.tipcard + .tipcard{margin-top:10px}
.tipcard.alert{background:var(--corail-doux);border-color:#F5C9CB}
.tipcard.alert .ic{color:var(--corail)}
.tipcard.vir{background:var(--mauve-doux);border-color:#E3C7DE}
.tipcard.vir .ic{color:var(--mauve)}
.mini{border:0;border-radius:999px;background:var(--mauve-fonce);color:#fff;font-weight:700;font-size:13px;padding:7px 16px;margin-top:8px;display:inline-flex;align-items:center;gap:6px}
.mini:hover{background:#6D3263}
.mini.okc{background:var(--azur)}

/* ---------- chart ---------- */
.chart-card{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:18px 18px 10px;box-shadow:0 1px 2px rgba(16,35,64,.05)}
.chart-card svg{width:100%;height:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 6px 6px;font-size:13px;color:var(--second)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.lg{width:11px;height:11px;border-radius:4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.chips .chip2{background:var(--carte);border:1px solid var(--ligne);border-radius:12px;padding:9px 15px;font-size:13.5px}
.chips b{font-weight:800;font-variant-numeric:tabular-nums}
.chip2 .u{color:var(--second)}
.seg-light{display:inline-flex;background:var(--carte);border:1px solid var(--ligne);border-radius:999px;padding:3px;margin-bottom:14px}
.seg-light button{border:0;background:transparent;color:var(--second);border-radius:999px;padding:6px 15px;font-size:13.5px;font-weight:600}
.seg-light button[aria-pressed="true"]{background:var(--nuit1);color:#fff}

/* ---------- settings ---------- */
.form-rows{display:flex;flex-direction:column}
.frow{display:flex;gap:9px;align-items:center;padding:9px 14px;border-top:1px solid var(--ligne);flex-wrap:wrap}
.frow:first-child{border-top:0}
.frow .fi{display:flex;flex-direction:column;gap:3px}
.frow .fi span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--second)}
input[type=text],input[type=number],input[type=date],select{
  border:1px solid var(--ligne);border-radius:9px;padding:7px 10px;background:#FBFCFE;min-width:0;
}
input[type=text]{flex:1;min-width:150px}
input[type=number]{width:105px;text-align:right;font-variant-numeric:tabular-nums}
input[type=date]{width:150px}
select{width:110px}
select.wide{width:130px}
input:focus,select:focus{outline:2px solid var(--azur);outline-offset:0;border-color:var(--azur)}
.confcell{display:flex;align-items:center;gap:8px;width:172px}
.confcell input[type=range]{flex:1;accent-color:var(--azur)}
.confcell output{font-weight:700;font-size:13px;min-width:44px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.del{border:0;background:transparent;color:#B9C5D6;border-radius:8px;padding:7px;display:grid;place-items:center}
.del:hover{color:var(--corail);background:var(--corail-doux)}
.add{width:100%;border:1.5px dashed #C4D2E4;background:transparent;color:var(--second);border-radius:0 0 15px 15px;padding:11px;font-weight:600;font-size:14px;border-top-width:1px}
.add:hover{color:var(--azur);border-color:var(--azur);background:var(--azur-doux)}
.kv{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.total-chip{margin-left:auto;background:var(--azur-doux);color:var(--azur);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.resetrow{display:flex;justify-content:flex-end;padding:12px 4px 0}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--encre)}
.chk input{width:17px;height:17px;accent-color:var(--azur)}

footer{padding:8px 0 46px;color:var(--second);font-size:13px;text-align:center}
footer b{color:var(--encre);font-weight:700}

@media (max-width:820px){
  .hero-grid{grid-template-columns:1fr}
  .hero{padding:24px 20px}
  .duo{grid-template-columns:1fr}
  nav.tabs{margin:18px 0 20px}
  .tabs-inner{width:100%;justify-content:space-between}
  .tabs-inner button{flex:1;padding:8px 8px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  .cloud{animation:none}
  html{scroll-behavior:auto}
}
</style>
</head>

<script>
'use strict';
/* ============ utilitaires ============ */
const TODAY0 = (()=>{const d=new Date();d.setHours(0,0,0,0);return d})();
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pISO=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const diffDays=d=>Math.round((d-TODAY0)/864e5);
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:2});
const fmtE=v=>eur.format(v);
const fmtD=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const fmtDL=d=>d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=> (crypto.randomUUID ? crypto.randomUUID() : 'id'+Math.random().toString(36).slice(2)+Date.now());
const MINUS='\u2212';

/* ============ icônes ============ */
const I={
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M19 5l-1.4 1.4M6.4 17.6L5 19"/>',

  storm:'<path d="M17.5 14H9a5 5 0 1 1 .5-9.98A6.5 6.5 0 0 1 22 7.6 3.5 3.5 0 0 1 17.5 14z"/><path d="M13.2 14.5l-2.6 4h3.6l-2.6 4"/>',
  shield:'<path d="M12 3l7 2.8v5.1c0 4.9-3.4 7.9-7 9.1-3.6-1.2-7-4.2-7-9.1V5.8z"/>',

const icon=(k,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;

/* ============ données de démonstration ============ */
function demoState(){
  return {
    mode:'pondere', reserve:0, seuilPerso:100, inclureVentes:true,
    decouvert:{pro:0, perso:0},
    comptes:{
      pro:{nom:'Pro',solde:0},
      perso:{nom:'Perso',solde:0}
    },
    fixes:[], ponct:[], enc:[], ventes:[], virements:[],
  };
}
const KEY='solaris-v1-2';
function load(){ try{const s=localStorage.getItem(KEY); if(s){const o=JSON.parse(s); if(o&&o.comptes&&o.enc) return o;}}catch(e){} return null; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S = load() || demoState();
S.dep=S.dep||[]; if(S.compterDecouvert===undefined) S.compterDecouvert=false;

/* ============ moteur de projection ============ */
const HORIZON=90;
const moyVentes=()=>{
  const origine=addDays(TODAY0,-90);
  const t=S.ventes.filter(v=>pISO(v.date)>=origine).reduce((a,v)=>a+v.montant,0);
  return t/3;
};
function confEff(e,d){
  if(e.rec==='caf' && e.revision && d>=pISO(e.revision)) return Math.min(e.conf,75);
  return e.conf;
}
function flows(days){
  const byDay={}, add=(n,it)=>{ if(n>=1&&n<=days){(byDay[n]=byDay[n]||[]).push(it);} };
  const Y=TODAY0.getFullYear(), M=TODAY0.getMonth(), mmax=Math.ceil(days/30)+1;
  for(const f of S.fixes){
    for(let m=0;m<=mmax;m++){
      const d=new Date(Y,M+m,Math.min(f.jour,dim(Y,M+m)));
      add(diffDays(d),{label:f.label,montant:f.montant,sens:'out',conf:100,type:'Charge fixe',compte:f.compte});
    }
  }
  for(const p of S.ponct) add(diffDays(pISO(p.date)),{label:p.label,montant:p.montant,sens:'out',conf:100,type:'Échéance',compte:p.compte});
  for(const e of S.enc){
    const base=pISO(e.date);
    if(e.rec==='mensuel'||e.rec==='caf'){
      for(let m=0;m<=mmax;m++){
        const d=new Date(Y,M+m,Math.min(base.getDate(),dim(Y,M+m)));
        const n=diffDays(d);
        if(e.rec==='caf'){
          const c=confEff(e,d);
          add(n,{label:e.label,montant:e.montant,sens:'in',conf:c,type:'Prime d\u2019activité',compte:e.compte,revisee:c<e.conf});
        } else add(n,{label:e.label,montant:e.montant,sens:'in',conf:e.conf,type:'Rentrée récurrente',compte:e.compte});
      }
    } else add(diffDays(base),{label:e.label,montant:e.montant,sens:'in',conf:e.conf,type:'Rentrée',compte:e.compte});
  }
  const mv=moyVentes();
  if(S.inclureVentes && mv>0){
    for(let m=0;m<=mmax;m++){
      const d=new Date(Y,M+m,15); d.setMonth(M+m);
      add(diffDays(d),{label:'Ventes (moyenne 3 mois)',montant:Math.round(mv),sens:'in',conf:60,type:'Ventes',compte:'perso'});
    }
  }
  return byDay;
}
const partEncais=(it,mode)=> mode==='prudent' ? (it.conf>=100?it.montant:0) : it.montant*it.conf/100;
const soldeDepart=c=> c==='all' ? S.comptes.pro.solde+S.comptes.perso.solde : S.comptes[c].solde;
function projeter(days,mode,sel='all',withVir=true){
  const f=flows(days); let solde=soldeDepart(sel); const serie=[{n:0,solde}];
  for(let n=1;n<=days;n++){
    for(const it of (f[n]||[])) if(sel==='all'||it.compte===sel) solde += it.sens==='out' ? -it.montant : partEncais(it,mode);
    if(sel!=='all'&&withVir) for(const v of S.virements){
      const j=diffDays(pISO(v.date));
      if(j===n){
        const delta=(v.sens==='pro2perso'?1:-1)*v.montant;
        solde += (sel==='perso') ? delta : -delta;
      }
    }
    serie.push({n,solde});
  }
  return serie;
}
function meteoCalc(mode){
  const f=flows(30); let enc=0,encBrut=0,ech=0,bigOut=null; const encListe=[];
  for(const n of Object.keys(f)) for(const it of f[n]){
    if(it.sens==='in'){ encBrut+=it.montant; enc+=partEncais(it,mode); encListe.push({l:it.label,m:it.montant,c:it.conf,n:+n}); }
    else { ech+=it.montant; if(!bigOut||it.montant>bigOut.montant) bigOut={...it,n:+n}; }
  }
  const couv=soldeDepart('all')+enc-ech-S.reserve;
  return {enc,encBrut,ech,bigOut,couv,env:Math.max(0,couv/30),encListe:encListe.sort((a,b)=>a.n-b.n)};
}
function pointBas(mode,sel,days=30){
  const P=projeter(days,mode,sel,true);
  let m=P[0]; for(let i=1;i<P.length;i++) if(P[i].solde<m.solde) m=P[i];
  return {...m,date:addDays(TODAY0,m.n)};
}
function calcVirement(){
  const P=projeter(30,S.mode,'perso',true), Q=projeter(30,S.mode,'pro',true);
  let nb=0; for(let i=0;i<P.length;i++) if(P[i].solde<P[nb].solde) nb=i;
  const besoin=Math.ceil((S.seuilPerso-P[nb].solde)/10)*10;
  if(besoin<=0) return null;
  for(let n=Math.max(1,nb);n<=30;n++){
    const apres=Q[n].solde-besoin;
    if(apres>=0) return {montant:besoin,n,date:addDays(TODAY0,n),faisable:true,proApres:apres};
  }
  return {montant:besoin,n:nb,date:addDays(TODAY0,nb),faisable:false,proApres:Q[nb].solde-besoin};
}
function enveloppeReelle(){
  const path=projeter(30,S.mode,'all',true);
  const min=Math.min(...path.map(p=>p.solde));
  const plancher=S.reserve-(S.compterDecouvert?(S.decouvert.perso||0):0);
  return {env:Math.max(0,min-plancher),min,plancher};
}
function niveau(env){
  if(env>=600) return {k:'degage',name:'Dégagé',icon:'sun',col:'#8FE6C0'};
  if(env>=300) return {k:'variable',name:'Variable',icon:'cloud',col:'#EFAB2B'};
  if(env>=80)  return {k:'couvert',name:'Couvert',icon:'rain',col:'#F0975C'};
  return {k:'orageux',name:"Orageux",icon:'storm',col:'#F58A8A'};
}

const objectifReserve=()=>3*totalFixes();

/* ============ rendu : calendrier ============ */
function vCal(){
  const days=HORIZON;
  const A=projeter(days,S.mode,calSel,true), P=projeter(days,'prudent',calSel,true);
  const pb=A.slice(1).reduce((m,p)=>p.solde<m.solde?p:m,A[1]);
  const pbDate=addDays(TODAY0,pb.n);
  const fin=A[days], finDate=addDays(TODAY0,days);
  const W=920,H=350,ml=60,mr=18,mt=18,mb=36, iw=W-ml-mr, ih=H-mt-mb;
  const allVals=[...A,...P].map(p=>p.solde);
  const top=Math.max(1000,Math.ceil(Math.max(S.reserve,...allVals)/1000)*1000);
  const bot=Math.min(0,Math.floor(Math.min(...allVals)/1000)*1000);
  const step=(top-bot)/1000>7?2000:1000;
  const X=n=>ml+iw*n/days, Y=v=>mt+ih*(1-(v-bot)/(top-bot));
  const path=ser=>ser.map((p,i)=>`${i?'L':'M'}${X(p.n).toFixed(1)} ${Y(p.solde).toFixed(1)}`).join(' ');
  const band=`M${A.map(p=>X(p.n).toFixed(1)+' '+Y(p.solde).toFixed(1)).join(' L')} L ${P.slice().reverse().map(p=>X(p.n).toFixed(1)+' '+Y(p.solde).toFixed(1)).join(' L')} Z`;
  let grid='';
  for(let t=bot;t<=top;t+=step){
    grid+=`<line x1="${ml}" y1="${Y(t)}" x2="${W-mr}" y2="${Y(t)}" stroke="#EAE3D8" stroke-width="1"/>
    <text x="${ml-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="#6B6459">${fmtE(t)}</text>`;
  }
  let xlab='';
  for(let n=1;n<=days;n++){
    const d=addDays(TODAY0,n);
    if(d.getDate()===1||n===days) xlab+=`<text x="${X(n)}" y="${H-12}" text-anchor="${n===days?'end':'middle'}" font-size="11" fill="#6B6459">${fmtD(d)}</text>`;
  }
  const f=flows(days), fA={}; A.forEach(p=>fA[p.n]=p.solde);
  let marks='';
  Object.keys(f).map(Number).sort((a,b)=>a-b).forEach(n=>{
    for(const it of f[n]){
      if(it.montant<400) continue;
      const col=it.sens==='in'?'var(--menthe)':'var(--corail)';
      const sign=it.sens==='in'?'+':MINUS;
      marks+=`<circle cx="${X(n)}" cy="${Y(fA[n])}" r="4.5" fill="${col}" stroke="#fff" stroke-width="1.5"><title>${fmtD(addDays(TODAY0,n))} — ${esc(it.label)} : ${sign}${fmtE(it.montant)}</title></circle>`;
    }
  });
  let virMarks='';
  if(calSel!=='all') S.virements.forEach(v=>{
    const n=diffDays(pISO(v.date));
    if(n>=1&&n<=days){ virMarks+=`<circle cx="${X(n)}" cy="${Y(fA[n])}" r="5" fill="var(--lavande)" stroke="#fff" stroke-width="1.5"><title>Virement : ${fmtE(v.montant)} ${v.sens==='pro2perso'?'pro → perso':'perso → pro'}</title></circle>`; }
  });
  const pbLblX=Math.min(X(pb.n)+8,W-130), pbLblAbove=Y(pb.solde)>46;
  const refLine = calSel==='all'
    ? `<line x1="${ml}" y1="${Y(S.reserve)}" x2="${W-mr}" y2="${Y(S.reserve)}" stroke="var(--lavande)" stroke-width="1.4" stroke-dasharray="5 5"/><text x="${W-mr}" y="${Y(S.reserve)-6}" text-anchor="end" font-size="11" fill="var(--lavande)" font-weight="700">Réserve ${fmtE(S.reserve)}</text>`
    : (calSel==='perso' ? `<line x1="${ml}" y1="${Y(S.seuilPerso)}" x2="${W-mr}" y2="${Y(S.seuilPerso)}" stroke="var(--lavande)" stroke-width="1.4" stroke-dasharray="5 5"/><text x="${W-mr}" y="${Y(S.seuilPerso)-6}" text-anchor="end" font-size="11" fill="var(--lavande)" font-weight="700">Seuil ${fmtE(S.seuilPerso)}</text>` : '');
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projection du solde sur 90 jours">
    ${grid}
    ${refLine}
    <path d="${band}" fill="rgba(161,79,148,.13)"/>
    <path d="${path(P)}" fill="none" stroke="#8A8378" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="${path(A)}" fill="none" stroke="var(--azur)" stroke-width="2.4" stroke-linejoin="round"/>
    ${marks}${virMarks}
    <line x1="${X(pb.n)}" y1="${Y(pb.solde)}" x2="${X(pb.n)}" y2="${H-mb}" stroke="var(--corail)" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>
    <circle cx="${X(pb.n)}" cy="${Y(pb.solde)}" r="6" fill="var(--corail)" stroke="#fff" stroke-width="2"/>
    <text x="${pbLblX}" y="${pbLblAbove?Y(pb.solde)-10:Y(pb.solde)+22}" font-size="12" font-weight="700" fill="var(--corail)" stroke="#fff" stroke-width="4" paint-order="stroke">Point bas ${fmtE(pb.solde)} · ${fmtD(pbDate)}</text>
    ${xlab}
  </svg>`;
  const pbPro=pointBas('prudent','pro',days), pbPerso=pointBas('prudent','perso',days);
  const evs=[];
  Object.keys(f).map(Number).sort((a,b)=>a-b).forEach(n=>{ for(const it of f[n]) if(it.montant>=100) evs.push({...it,n}); });
  const next=evs.slice(0,10);
  const sbtn=(k,lbl)=>`<button data-csel="${k}" aria-pressed="${calSel===k}">${lbl}</button>`;
  return `
  <section class="block">
    <h2 class="display">Projection sur 90 jours</h2>
    <p class="hint">Solde projeté jour par jour, virements planifiés inclus. La zone mauve pâle matérialise l'incertitude : les rentrées dont la confiance est inférieure à 100 %.</p>
    <div class="seg-light" role="group" aria-label="Compte affiché">
      ${sbtn('all','Tous comptes')}${sbtn('pro',esc(S.comptes.pro.nom))}${sbtn('perso',esc(S.comptes.perso.nom))}
    </div>
    <div class="chips">
      <span class="chip2">Perso — point bas <b class="amt ${pbPerso.solde<S.seuilPerso?'out':''}">${fmtE(pbPerso.solde)}</b> <span class="u">le ${fmtD(pbPerso.date)}</span></span>
      <span class="chip2">Pro — point bas <b class="amt ${pbPro.solde<0?'out':''}">${fmtE(pbPro.solde)}</b> <span class="u">le ${fmtD(pbPro.date)}</span></span>
      <span class="chip2">${calSel==='all'?'Total':esc(nomCompte(calSel))} au ${fmtD(finDate)} <b>${fmtE(fin.solde)}</b> <span class="u">· pondéré</span></span>
    </div>
    <div class="chart-card">
      ${svg}
      <div class="legend">
        <span><span class="lg" style="background:var(--azur)"></span>Scénario espéré — paiements pondérés par confiance</span>
        <span><span class="lg" style="background:#8A8378"></span>Scénario prudent — paiements certains uniquement</span>
        <span><span class="lg" style="background:rgba(161,79,148,.2)"></span>Incertitude</span>
        ${calSel!=='all'?'<span><span class="lg" style="background:var(--lavande);border-radius:50%"></span>Virements planifiés</span>':''}
      </div>
    </div>
  </section>
  <section class="block">
    <h2 class="display">Mouvements à venir (≥ 100 €)</h2>
    <p class="hint">Les 10 prochains mouvements significatifs${calSel==='all'?'':' — compte '+esc(nomCompte(calSel))}.</p>
    <div class="rows">
      ${next.map(it=>`<div class="row">
        <span class="dot" style="background:${it.sens==='in'?'var(--menthe)':'var(--corail)'}"></span>
        <div class="grow"><p class="lbl">${esc(it.label)}</p><p class="sub">${fmtD(addDays(TODAY0,it.n))} · ${it.type}</p></div>
        <span class="badge ${it.compte==='pro'?'az':'lv'}">${it.compte==='pro'?'Pro':'Perso'}</span>
        ${it.conf<100?`<span class="badge amb">${it.conf} %</span>`:''}
        <span class="amt ${it.sens}">${it.sens==='in'?'+':MINUS}${fmtE(it.montant)}</span>
      </div>`).join('')}
    </div>
  </section>`;
}

/* ============ rendu : réglages ============ */
function vRegl(){
  const mv=moyVentes();
  const vir=calcVirement();
  const comptSel=(path,val)=>`<div class="fi"><span>Compte</span><select data-f="${path}" class="wide" aria-label="Compte"><option value="pro" ${val==='pro'?'selected':''}>Pro</option><option value="perso" ${val==='perso'?'selected':''}>Perso</option></select></div>`;
  return `
  <section class="block">
    <h2 class="display">Tes deux comptes</h2>
    <p class="hint">Mets les soldes à jour quand tu veux (par exemple chaque matin) : toute la météo se recalcule. Tu as choisi la saisie manuelle plutôt que l'import — c'est plus léger et tout aussi fiable si tu le fais régulièrement.</p>
    <div class="duo">
      ${['pro','perso'].map(k=>`<div class="card stat">
        <h3>${icon(k==='pro'?'station':'shield')} ${k==='pro'?'Compte pro':'Compte perso'}</h3>
        <div class="fi" style="margin-top:8px"><span>Nom</span><input type="text" data-f="comptes.${k}.nom" value="${esc(S.comptes[k].nom)}" aria-label="Nom du compte"></div>
        <div class="kv" style="margin-top:8px"><div class="fi"><span>Solde du jour</span><input type="number" step="1" data-f="comptes.${k}.solde" value="${S.comptes[k].solde}" aria-label="Solde"></div><span style="color:var(--second)">€</span></div>
        <div class="kv" style="margin-top:8px"><div class="fi"><span>Découvert autorisé</span><input type="number" step="1" data-f="decouvert.${k}" value="${S.decouvert[k]}" aria-label="Découvert autorisé"></div><span style="color:var(--second)">€</span></div>
      </div>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2 class="display">Réserve de sécurité</h2>
    <p class="hint">Non dépensable : elle absorbe un retard de paiement ou une dépense imprévue. Recommandation : 3 mois de charges fixes, soit ${fmtE(objectifReserve())}.</p>
    <div class="rows"><div class="frow"><div class="fi"><span>Réserve actuelle</span><input type="number" step="1" data-f="reserve" value="${S.reserve}" aria-label="Réserve"></div><span style="color:var(--second)">€</span></div>
    <div class="frow"><label class="chk"><input type="checkbox" data-f="compterDecouvert" ${S.compterDecouvert?'checked':''}> Compter le découvert autorisé du perso (${fmtE(S.decouvert.perso)}) dans le disponible réaliste</label></div></div>
  </section>

  <section class="block">
    <h2 class="display">Charges fixes</h2>
    <p class="hint">Prélevées chaque mois, le jour indiqué, sur le compte indiqué. Total : ${fmtE(totalFixes())} par mois.</p>
    <div class="rows form-rows">
      ${S.fixes.map(it=>`<div class="frow">
        <input type="text" data-f="fixes.${it.id}.label" value="${esc(it.label)}" aria-label="Nom de la charge">
        <input type="number" step="0.01" data-f="fixes.${it.id}.montant" value="${it.montant}" aria-label="Montant">
        <div class="fi"><span>Jour</span><input type="number" min="1" max="28" data-f="fixes.${it.id}.jour" value="${it.jour}" style="width:88px"></div>
        ${comptSel('fixes.'+it.id+'.compte', it.compte)}
        <button class="del" data-del="fixes.${it.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('')}
      <button class="add" data-add="fixes">+ Ajouter une charge fixe</button>
    </div>
  </section>

  <section class="block">
    <h2 class="display">Échéances ponctuelles</h2>
    <p class="hint">Les grosses sorties à dates fixes : cotisations sociales URSSAF, débits annuels. Quand une échéance est débitée, clique <b>✓ Payée</b> : le montant sort du solde et la prévision disparaît. Ce sont elles qui creusent le point bas. En auto-entreprise, les cotisations suivent ton chiffre d'affaires — nous les projeterons automatiquement à chaque encaissement dans une prochaine version.</p>
    <div class="rows form-rows">
      ${S.ponct.map(it=>`<div class="frow">
        <input type="text" data-f="ponct.${it.id}.label" value="${esc(it.label)}" aria-label="Nom de l'échéance">
        <input type="number" step="0.01" data-f="ponct.${it.id}.montant" value="${it.montant}" aria-label="Montant">
        <div class="fi"><span>Date</span><input type="date" data-f="ponct.${it.id}.date" value="${it.date}"></div>
        ${comptSel('ponct.'+it.id+'.compte', it.compte)}
        <button class="mini okc" data-recvd="ponct.${it.id}">✓ Payée</button> <button class="del" data-del="ponct.${it.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('')}
      <button class="add" data-add="ponct">+ Ajouter une échéance</button>
    </div>
  </section>

  <section class="block">
    <h2 class="display">Rentrées prévues</h2>
    <p class="hint">Chaque rentrée porte un niveau de confiance : facture échue = 100 %, devis signé ≈ 70 %, simple piste = 0 %. La météo ne compte les rentrées qu'au prorata de leur confiance. Quand le virement tombe réellement (parfois avant la date prévue), clique <b>✓ Reçue</b> : le montant s'ajoute au solde du compte et la prévision disparaît — toute la météo se met à jour.</p>
    <div class="rows form-rows">
      ${S.enc.map(it=>`<div class="frow">
        <input type="text" data-f="enc.${it.id}.label" value="${esc(it.label)}" aria-label="Nom de la rentrée">
        <input type="number" step="0.01" data-f="enc.${it.id}.montant" value="${it.montant}" aria-label="Montant">
        <div class="fi"><span>Date espérée</span><input type="date" data-f="enc.${it.id}.date" value="${it.date}"></div>
        <div class="fi"><span>Confiance</span><div class="confcell"><input type="range" min="0" max="100" step="5" data-f="enc.${it.id}.conf" value="${it.conf}" aria-label="Confiance"><output>${it.conf} %</output></div></div>
        <div class="fi"><span>Récurrence</span><select data-f="enc.${it.id}.rec" class="wide" aria-label="Récurrence">
          <option value="non" ${it.rec==='non'?'selected':''}>Ponctuel</option>
          <option value="mensuel" ${it.rec==='mensuel'?'selected':''}>Mensuel</option>
          <option value="caf" ${it.rec==='caf'?'selected':''}>Prime CAF</option></select></div>
        ${it.rec==='caf'?`<div class="fi"><span>Prochaine révision</span><input type="date" data-f="enc.${it.id}.revision" value="${it.revision||''}" aria-label="Prochaine révision"></div>`:''}
        ${comptSel('enc.'+it.id+'.compte', it.compte)}
        <button class="mini okc" data-recvd="enc.${it.id}">✓ Reçue</button> <button class="del" data-del="enc.${it.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('')}
      <button class="add" data-add="enc">+ Ajouter une rentrée</button>
    </div>
    <p class="hint" style="margin-top:10px">Prime CAF : versée chaque mois à la même date ; après la date de révision (tous les 3 mois), elle est comptée à 75 % de confiance jusqu'à ce que tu mettes le montant à jour.</p>
  </section>

  <section class="block" id="depsec">
    <h2 class="display">Dépenses variables</h2>
    <p class="hint">Saisis chaque dépense du quotidien au moment où tu la paies : le solde du compte diminue et l'enveloppe du jour se recalcule aussitôt. C'est le lien entre « ce que je peux dépenser » et « ce que je viens de dépenser ».</p>
    <div class="rows"><div class="frow">
      <input type="text" id="depL" placeholder="Courses, essence, café…" aria-label="Quoi ?" style="flex:2;min-width:180px">
      <input type="number" step="0.01" id="depM" placeholder="0,00" aria-label="Combien ?" style="width:110px">
      <select id="depC" class="wide" aria-label="Sur quel compte ?"><option value="perso">Perso</option><option value="pro">Pro</option></select>
      <button class="mini okc" data-depadd style="flex:none">Enregistrer</button>
    </div></div>
    <div class="rows form-rows" style="margin-top:10px">
      ${S.dep.length?'':'<div class="frow"><span style="color:var(--second);font-size:14px">Aucune dépense saisie pour l\u2019instant.</span></div>'}
      ${S.dep.slice().reverse().slice(0,8).map(d=>`<div class="frow">
        <input type="text" value="${esc(d.label)}" disabled style="flex:2;opacity:.75">
        <input type="number" value="${d.montant}" disabled style="opacity:.75">
        <span class="badge ${d.compte==='pro'?'az':'lv'}">${d.compte==='pro'?'Pro':'Perso'}</span>
        <button class="del" data-depdel="${d.id}" aria-label="Annuler cette dépense (recrediter le compte)">${icon('trash')}</button></div>`).join('')}
    </div>
  </section>

  <section class="block">
    <h2 class="display">Virements entre comptes</h2>
    <p class="hint">${vir
      ? `Virement conseillé : <b>${fmtE(vir.montant)} le ${fmtD(vir.date)}</b> pour que le compte perso ne passe pas sous ${fmtE(S.seuilPerso)}.`
      : `Aucun virement nécessaire sur 30 jours : le compte perso reste au-dessus de ton seuil avec les virements déjà planifiés.`}</p>
    <div class="rows"><div class="frow">
      <div class="fi"><span>Garder au moins sur le perso</span><input type="number" step="10" data-f="seuilPerso" value="${S.seuilPerso}" aria-label="Seuil du compte perso"></div>
      <span style="color:var(--second)">€ — l'app calcule le virement qui garantit ce plancher.</span>
    </div></div>
    <div class="rows form-rows" style="margin-top:10px">
      ${S.virements.map(it=>`<div class="frow">
        <div class="fi"><span>Date</span><input type="date" data-f="virements.${it.id}.date" value="${it.date}"></div>
        <input type="number" step="1" data-f="virements.${it.id}.montant" value="${it.montant}" aria-label="Montant">
        <div class="fi"><span>Sens</span><select data-f="virements.${it.id}.sens" class="wide" aria-label="Sens">
          <option value="pro2perso" ${it.sens==='pro2perso'?'selected':''}>Pro → Perso</option>
          <option value="perso2pro" ${it.sens==='perso2pro'?'selected':''}>Perso → Pro</option></select></div>
        ${it.auto?'<span class="badge lv">conseillé</span>':''}
        <button class="del" data-del="virements.${it.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('')}
      <button class="add" data-add="virements">+ Planifier un virement</button>

    <div class="rows"><div class="frow">
      <span class="badge lv">Moyenne 3 mois : ${fmtE(Math.round(mv))}/mois</span>
      <label class="chk"><input type="checkbox" data-f="inclureVentes" ${S.inclureVentes?'checked':''}> Inclure cette moyenne dans la météo (confiance 60 %)</label>
    </div></div>
    <div class="rows form-rows" style="margin-top:10px">
      ${S.ventes.slice().reverse().map(it=>`<div class="frow">
        <div class="fi"><span>Plateforme</span><select data-f="ventes.${it.id}.plateforme" class="wide" aria-label="Plateforme">
          ${['Vinted','Le Bon Coin','Momox','Gibert','Recyclivres','Hamelyn','Autre'].map(p=>`<option ${it.plateforme===p?'selected':''}>${p}</option>`).join('')}
        </select></div>
        <input type="number" step="1" data-f="ventes.${it.id}.montant" value="${it.montant}" aria-label="Montant">
        <div class="fi"><span>Date</span><input type="date" data-f="ventes.${it.id}.date" value="${it.date}"></div>
        <button class="del" data-del="ventes.${it.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('')}
      <button class="add" data-add="ventes">+ Ajouter une vente</button>
    </div>
  </section>
  <div class="resetrow"><button class="add" style="width:auto;border-radius:999px;padding:10px 20px" data-reset>Réinitialiser mes données de départ</button></div>`;
}

/* ============ interactions ============ */
function wire(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  view.querySelectorAll('[data-go]').forEach(c=>{
    c.addEventListener('click',()=>{setTab(c.dataset.go); if(c.dataset.anchor) setTimeout(()=>{const el=document.getElementById(c.dataset.anchor); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},80);});
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setTab(c.dataset.go);}});
  });
  view.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{S.mode=b.dataset.mode;save();render();}));
  view.querySelectorAll('[data-csel]').forEach(b=>b.addEventListener('click',()=>{calSel=b.dataset.csel;render();}));
  view.querySelectorAll('input[data-f],select[data-f]').forEach(inp=>{
    inp.addEventListener('change',()=>{editF(inp.dataset.f,valOf(inp));save();render();});
  });
  view.querySelectorAll('.confcell input[type=range]').forEach(r=>{
    r.addEventListener('input',()=>{r.parentElement.querySelector('output').textContent=r.value+' %';});
  });
  view.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const[c,id]=b.dataset.del.split('.'); S[c]=S[c].filter(x=>x.id!==id); save(); render();
  }));
  view.querySelectorAll('[data-depadd]').forEach(b=>b.addEventListener('click',()=>{
    const l=document.getElementById('depL'), m=document.getElementById('depM'), c=document.getElementById('depC');
    const montant=parseFloat((m.value||'').replace(',','.'))||0;
    if(!l.value.trim()||montant<=0) return;
    S.comptes[c.value].solde-=montant;
    S.dep.push({id:uid(),label:l.value.trim(),montant,date:iso(TODAY0),compte:c.value});
    save(); render();
  }));
  view.querySelectorAll('[data-depdel]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.dataset.depdel; const d=S.dep.find(x=>x.id===id); if(!d) return;
    S.comptes[d.compte].solde+=d.montant; S.dep=S.dep.filter(x=>x.id!==id); save(); render();
  }));
  view.querySelectorAll('[data-recvd]').forEach(b=>b.addEventListener('click',()=>{
    const[c,id]=b.dataset.recvd.split('.'); const it=S[c].find(x=>x.id===id); if(!it) return;
    S.comptes[it.compte||'pro'].solde += (c==='enc'?1:-1)*it.montant;
    S[c]=S[c].filter(x=>x.id!==id); save(); render();
  }));
  view.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.add, off=n=>iso(addDays(TODAY0,n));
    if(k==='fixes') S.fixes.push({id:uid(),label:'Nouvelle charge fixe',montant:50,jour:5,compte:'pro'});
    if(k==='ponct') S.ponct.push({id:uid(),label:'Nouvelle échéance',montant:500,date:off(30),compte:'pro'});
    if(k==='enc') S.enc.push({id:uid(),label:'Nouvelle rentrée',montant:1000,date:off(15),conf:100,rec:'non',compte:'pro'});
    if(k==='virements') S.virements.push({id:uid(),montant:100,date:off(7),sens:'pro2perso',auto:false});
    if(k==='ventes') S.ventes.push({id:uid(),plateforme:'Vinted',montant:40,date:off(2)});
    save(); render();
  }));
  view.querySelectorAll('[data-prog]').forEach(b=>b.addEventListener('click',()=>{
    const v=JSON.parse(b.dataset.prog);
    S.virements.push({id:uid(),montant:v.montant,date:v.date,sens:'pro2perso',auto:true});
    save(); render();
  }));
  const rst=view.querySelector('[data-reset]');
  if(rst) rst.addEventListener('click',()=>{ if(confirm('Réinitialiser avec tes données de départ ? Les modifications faites depuis le chargement seront perdues.')){S=demoState();save();render();} });
}
function valOf(inp){
  if(inp.type==='checkbox') return inp.checked;
  if(inp.type==='number') return parseFloat(inp.value.replace(',','.'))||0;
  if(inp.type==='range') return +inp.value;
  return inp.value;
}
function editF(path,val){
  if(path==='reserve'){S.reserve=val;return;}
  if(path==='seuilPerso'){S.seuilPerso=Math.max(0,val);return;}
  if(path==='inclureVentes'){S.inclureVentes=val;return;}
  if(path==='compterDecouvert'){S.compterDecouvert=val;return;}
  const parts=path.split('.');
  if(parts[0]==='decouvert'){ S.decouvert[parts[1]]=Math.max(0,val); return; }
  if(parts[0]==='comptes'){ S.comptes[parts[1]][parts[2]]=val; return; }
  const[c,id,field]=parts;
  const it=S[c].find(x=>x.id===id); if(!it) return;
  if(field==='jour') it.jour=Math.min(28,Math.max(1,Math.round(val)||1));
  else it[field]=val;
}
